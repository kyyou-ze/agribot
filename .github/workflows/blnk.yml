name: Flatten Folder to Root

# Cara pakai:
# Workflow ini memindahkan SEMUA isi subfolder ke root repo dan MENIMPA (overwrite)
# file lama yang namanya sama, termasuk yang berada di dalam subfolder.
#
# Jalankan manual: tab Actions > "Flatten Folder to Root" > Run workflow,
# isi nama foldernya (default sudah "VTuberApp").

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Nama folder yang isinya mau dipindah ke root repo"
        required: false
        default: "VTuberApp"

jobs:
  flatten:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pindahkan dan timpa isi folder ke root
        env:
          FOLDER: ${{ inputs.folder }}
        run: |
          # Hapus tanda slash (/) di akhir nama folder jika user mengetik "VTuberApp/"
          FOLDER="${FOLDER%/}"

          if [ -z "$FOLDER" ] || [ ! -d "$FOLDER" ]; then
            echo "Folder '$FOLDER' tidak ditemukan di root repo, dibatalkan."
            exit 1
          fi

          echo "Memindahkan dan menimpa isi '$FOLDER/' ke root..."
          shopt -s dotglob nullglob

          for item in "$FOLDER"/*; do
            name="$(basename "$item")"

            # Lewati folder sistem seperti .git atau .github
            if [ "$name" = ".git" ] || [ "$name" = ".github" ]; then
              echo "Lewati '$name' (folder sistem)."
              continue
            fi

            # Salin dan paksa timpa (-rfT memastikan isi subfolder digabung & ditimpa)
            cp -rfT "$item" "./$name"
            
            # Hapus item asal setelah berhasil disalin
            rm -rf "$item"
            echo "Berhasil memindahkan/menimpa: $name"
          done

          shopt -u dotglob nullglob

          # Hapus folder utama jika sudah kosong
          if [ -z "$(ls -A "$FOLDER")" ]; then
            rmdir "$FOLDER"
            echo "Folder '$FOLDER' berhasil dihapus."
          else
            echo "Peringatan: Folder '$FOLDER' tidak dihapus karena masih ada sisa file yang dilewati."
          fi

          echo "Selesai."

      - name: Commit hasil
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: flatten folder ${{ inputs.folder }} to root (overwrite)"
          file_pattern: "."
          
