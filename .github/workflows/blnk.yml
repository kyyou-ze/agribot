name: Flatten Folder to Root

# Cara pakai:
# Kalau hasil unzip kemarin nyangkut di dalam subfolder (misal "VTuberApp/"),
# workflow ini memindahkan SEMUA isi folder itu ke root repo (menimpa yang lama),
# menghapus folder asalnya, lalu commit hasilnya.
#
# Jalankan manual: tab Actions > "Flatten Folder to Root" > Run workflow,
# isi nama foldernya (default sudah "VTuberApp").

on:
  workflow_dispatch:
    inputs:
      folder:
        description: "Nama folder yang isinya mau dipindah ke root repo"
        required: false
        default: "VTuberApp"

jobs:
  flatten:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Pindahkan isi folder ke root (timpa yang lama)
        env:
          FOLDER: ${{ github.event.inputs.folder }}
        run: |
          if [ ! -d "$FOLDER" ]; then
            echo "Folder '$FOLDER' tidak ditemukan di root repo, dibatalkan."
            exit 1
          fi

          # Pindahkan ke direktori sementara agar aman jika nama subfolder di dalamnya sama dengan $FOLDER
          TMP_DIR=$(mktemp -d)
          shopt -s dotglob nullglob
          mv "$FOLDER"/* "$TMP_DIR"/
          shopt -u dotglob nullglob

          # Hapus folder asal yang sudah kosong
          rm -rf "$FOLDER"

          # Salin semua ke root dengan menimpa file/folder yang sudah ada
          echo "Memindahkan isi ke root dan menimpa file lama..."
          cp -rf "$TMP_DIR"/. ./
          rm -rf "$TMP_DIR"

          echo "Selesai."

      - name: Commit hasil
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: flatten folder ${{ github.event.inputs.folder }} to root"
          file_pattern: "."
          
