name: Deploy server ke panel

on:
  push:
    branches: [main]
    paths: ['server/**', 'scripts/deploy-panel.js', '.github/workflows/deploy-server.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Uji server (batal deploy bila gagal)
        run: node test/smoke.js
        working-directory: server

      - name: Unggah ke panel Pterodactyl dan restart
        env:
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_CLIENT_KEY: ${{ secrets.PTERO_CLIENT_KEY }}
          PTERO_SERVER_ID: ${{ secrets.PTERO_SERVER_ID }}
        run: node scripts/deploy-panel.js
