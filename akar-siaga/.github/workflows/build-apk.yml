name: Build APK

on:
  push:
    branches: [main]
    paths: ['app_src/**', 'app_firebase/**', 'scripts/patch_android.py', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # true bila secret GOOGLE_SERVICES_JSON diisi -> push Firebase diaktifkan; kosong -> build biasa tanpa Firebase
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat kerangka project Android
        run: flutter create --platforms=android --org id.akarsiaga --project-name akar_siaga build_app

      - name: Salin kode aplikasi
        run: |
          rm -rf build_app/lib build_app/test
          cp -r app_src/. build_app/

      - name: Siapkan Firebase (hanya bila secret GOOGLE_SERVICES_JSON ada)
        if: env.HAS_FIREBASE == 'true'
        env:
          GSJ: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s' "$GSJ" > build_app/android/app/google-services.json
          cp -r app_firebase/. build_app/
          cd build_app && flutter pub add firebase_core firebase_messaging

      - name: Patch Android (izin, desugaring, Firebase bila aktif)
        run: |
          FLAG=""
          if [ "$HAS_FIREBASE" = "true" ]; then FLAG="--firebase"; fi
          python3 scripts/patch_android.py build_app $FLAG

      - run: flutter pub get
        working-directory: build_app

      - name: Analisis kode
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: build_app

      - run: flutter build apk --release
        working-directory: build_app

      - uses: actions/upload-artifact@v4
        with:
          name: AkarSiaga-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
