name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat kerangka project Android
        run: flutter create --platforms=android --org id.agribot --project-name agribot build_app

      - name: Salin kode aplikasi
        run: |
          rm -rf build_app/lib build_app/test
          cp -r app_src/. build_app/

      - name: Patch Android (izin, HTTP lokal, desugaring)
        working-directory: build_app
        run: |
          python3 - <<'EOF'
          import os
          # --- Manifest: internet, notifikasi, HTTP tanpa TLS (alat lokal & server tanpa HTTPS) ---
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = '''
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          '''
          assert '<application' in s
          s = s.replace('<application', perms + '<application android:usesCleartextTraffic="true"', 1)
          open(p, 'w').write(s)
          # --- Core library desugaring (dibutuhkan flutter_local_notifications) ---
          done = False
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              if not os.path.exists(f):
                  continue
              g = open(f).read()
              assert 'compileOptions {' in g
              if f.endswith('.kts'):
                  g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
                  g += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  g = g.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
                  g += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              open(f, 'w').write(g)
              done = True
          assert done
          EOF
          sed -i 's/android:label="[^"]*"/android:label="AgriBot"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
        working-directory: build_app

      - name: Analisis kode (gagalkan build bila ada error)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: build_app

      - run: flutter build apk --release
        working-directory: build_app

      - uses: actions/upload-artifact@v4
        with:
          name: AgriBot-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
